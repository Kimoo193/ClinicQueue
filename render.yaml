services:
  - type: web
    name: clinicqueue-api
    runtime: docker
    dockerfilePath: docker/Dockerfile.render.api
    dockerContext: .
    region: frankfurt
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Hangfire__Enabled
        value: "true"
      - key: Database__ApplyMigrationsOnStartup
        value: "true"
      # Render's free instance has a very low inotify-instance limit; ASP.NET Core's default
      # appsettings.json file watcher hits it and crashes the app during CreateBuilder(args),
      # before any of our code runs. Nothing to watch for changes in a container anyway.
      - key: DOTNET_hostBuilder__reloadConfigOnChange
        value: "false"
      # Secrets: set once in the Render dashboard when applying this blueprint. Never
      # committed here — see the deployment notes for the values to paste in.
      - key: ConnectionStrings__Default
        sync: false
      - key: ConnectionStrings__Migrations
        sync: false
      - key: ConnectionStrings__Privileged
        sync: false
      - key: Jwt__SigningKey
        sync: false
      - key: Vapid__PublicKey
        sync: false
      - key: Vapid__PrivateKey
        sync: false
