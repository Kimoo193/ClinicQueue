services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - web
    networks:
      - clinicqueue

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=clinicqueue;Username=clinicqueue;Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Vapid__PublicKey: ${VAPID_PUBLIC_KEY}
      Vapid__PrivateKey: ${VAPID_PRIVATE_KEY}
      Hangfire__Enabled: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - clinicqueue
    restart: unless-stopped

  hangfire-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=clinicqueue;Username=clinicqueue;Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Vapid__PublicKey: ${VAPID_PUBLIC_KEY}
      Vapid__PrivateKey: ${VAPID_PRIVATE_KEY}
      Hangfire__Enabled: "true"
      Hangfire__ServerOnly: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - clinicqueue
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    networks:
      - clinicqueue
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clinicqueue
      POSTGRES_USER: clinicqueue
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicqueue -d clinicqueue"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - clinicqueue
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - clinicqueue
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  clinicqueue:
    driver: bridge
