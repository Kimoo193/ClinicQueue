services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - web
    networks:
      - clinicqueue

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # App connects as the non-owner, RLS-enforced role. Migrations run as the owner.
      # Cross-tenant (SuperAdmin/platform + background jobs) use the BYPASSRLS role.
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=clinicqueue;Username=clinicqueue_app;Password=${APP_DB_PASSWORD}
      ConnectionStrings__Migrations: Host=postgres;Port=5432;Database=clinicqueue;Username=clinicqueue;Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Privileged: Host=postgres;Port=5432;Database=clinicqueue;Username=clinicqueue_bypassrls;Password=${BYPASS_DB_PASSWORD}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Vapid__PublicKey: ${VAPID_PUBLIC_KEY}
      Vapid__PrivateKey: ${VAPID_PRIVATE_KEY}
      Hangfire__Enabled: "true"
      Database__ApplyMigrationsOnStartup: "true"
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - clinicqueue
    restart: unless-stopped

  hangfire-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Worker executes background jobs cross-tenant via the BYPASSRLS role (PrivilegedJobActivator);
      # its app-role connection is RLS-enforced like the API.
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=clinicqueue;Username=clinicqueue_app;Password=${APP_DB_PASSWORD}
      ConnectionStrings__Migrations: Host=postgres;Port=5432;Database=clinicqueue;Username=clinicqueue;Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Privileged: Host=postgres;Port=5432;Database=clinicqueue;Username=clinicqueue_bypassrls;Password=${BYPASS_DB_PASSWORD}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Vapid__PublicKey: ${VAPID_PUBLIC_KEY}
      Vapid__PrivateKey: ${VAPID_PRIVATE_KEY}
      Hangfire__Enabled: "true"
      Hangfire__ServerOnly: "true"
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - clinicqueue
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    networks:
      - clinicqueue
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clinicqueue
      POSTGRES_USER: clinicqueue
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Consumed by postgres-init/01-roles.sh on first cluster init to create the
      # non-owner clinicqueue_app / clinicqueue_bypassrls roles.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      BYPASS_DB_PASSWORD: ${BYPASS_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Role provisioning runs only on a fresh data volume (docker-entrypoint-initdb.d).
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicqueue -d clinicqueue"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - clinicqueue
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      # Prefer env over `redis-cli -a` so the password is not visible in `ps`
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - clinicqueue
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  clinicqueue:
    driver: bridge
