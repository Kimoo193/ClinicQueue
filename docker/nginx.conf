worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    # First-layer rate limiting (login / sensitive ops refined in API)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    upstream api_upstream {
        server api:8080;
    }

    upstream web_upstream {
        server web:80;
    }

    # Redirect HTTP → HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # Per-clinic subdomain + apex → same app; tenant resolved by host at the API
    server {
        listen 443 ssl http2;
        server_name ~^(?<clinic_slug>.+)\.clinicqueue\.app$ clinicqueue.app www.clinicqueue.app;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security headers (medical data). `always` also emits them on error responses.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # TODO: add a Content-Security-Policy tuned to the SPA's asset/WSS origins
        # once the frontend build output is finalized (must allow SignalR wss: + Web Push).

        # API
        location /api/ {
            limit_req zone=api_limit burst=60 nodelay;
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Clinic-Slug $clinic_slug;
        }

        # SignalR / WebSockets
        location /hubs/ {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
        }

        # Health (no rate limit)
        location /health {
            proxy_pass http://api_upstream;
            proxy_set_header Host $host;
        }

        # SPA
        location / {
            proxy_pass http://web_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
