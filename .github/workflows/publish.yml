# Build and push API + web images to GHCR on version tags (v*).
# Auth: GITHUB_TOKEN only — no extra secrets required for public/private GHCR push from this repo.
name: Publish

on:
  push:
    tags: ['v*']

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            file: docker/Dockerfile.api
          - name: web
            file: docker/Dockerfile.web

    steps:
      - uses: actions/checkout@v5

      - name: Lowercase image repository
        id: image
        run: |
          owner_repo="${{ github.repository }}"
          echo "name=${owner_repo,,}" >> "$GITHUB_OUTPUT"

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/${{ matrix.name }}:${{ steps.version.outputs.VERSION }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
