# Build and test on every push/PR to master.
# Integration tests use Testcontainers (Postgres) — Docker on the runner is required; no Postgres service.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ClinicQueue.slnx

      - name: Build
        run: dotnet build ClinicQueue.slnx --no-restore --configuration Release

      - name: Format check
        run: dotnet format ClinicQueue.slnx --verify-no-changes --no-restore

      - name: Test
        run: >
          dotnet test ClinicQueue.slnx
          --no-build
          --configuration Release
          --logger trx
          --results-directory TestResults

      - name: Publish test results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
